<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Veri Arşivi</title>
    <style>
        :root {
            --neon-green: #39ff14;
            --bg-dark: #050505;
            --panel-bg: #111111;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--neon-green);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background-color: var(--panel-bg);
            border: 1px solid var(--neon-green);
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.2), inset 0 0 10px rgba(57, 255, 20, 0.1);
            padding: 30px;
            border-radius: 5px;
        }

        h1 {
            text-align: center;
            text-transform: uppercase;
            text-shadow: 0 0 5px var(--neon-green), 0 0 10px var(--neon-green);
            border-bottom: 1px dashed var(--neon-green);
            padding-bottom: 15px;
            margin-bottom: 30px;
        }

        h2 {
            font-size: 1.2em;
            text-shadow: 0 0 3px var(--neon-green);
            margin-top: 30px;
        }

        /* Fotoğraf Galerisi (Grid Yapısı) */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .gallery-item {
            position: relative;
            border: 1px solid var(--neon-green);
            padding: 5px;
            background-color: #000;
            transition: all 0.3s ease;
        }

        .gallery-item:hover {
            box-shadow: 0 0 15px var(--neon-green);
            transform: scale(1.02);
        }

        .gallery-item img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            display: block;
            opacity: 0.8;
            transition: opacity 0.3s;
        }

        .gallery-item:hover img {
            opacity: 1;
        }

        /* İndirme Butonları */
        .download-section {
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn-download {
            display: inline-block;
            color: var(--bg-dark);
            background-color: var(--neon-green);
            text-decoration: none;
            padding: 12px 20px;
            font-weight: bold;
            text-transform: uppercase;
            text-align: center;
            border-radius: 3px;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.5);
        }

        .btn-download:hover {
            background-color: var(--bg-dark);
            color: var(--neon-green);
            border: 1px solid var(--neon-green);
            box-shadow: 0 0 20px var(--neon-green), inset 0 0 10px var(--neon-green);
        }

        /* Yanıp Sönen İmleç Efekti */
        .cursor {
            display: inline-block;
            width: 10px;
            height: 20px;
            background-color: var(--neon-green);
            animation: blink 1s step-end infinite;
            vertical-align: text-bottom;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>[ SİSTEM VERİ ARŞİVİ ]<span class="cursor"></span></h1>

        <h2>>_ GÖRSEL_KAYITLAR</h2>
        <div class="gallery">
            <!-- Fotoğraf eklemek için bu bloğu kopyalayıp çoğaltabilirsin -->
            <div class="gallery-item">
                <img src="foto1.jpg" alt="Veri Görseli 1">
            </div>
            <div class="gallery-item">
                <img src="foto2.jpg" alt="Veri Görseli 2">
            </div>
            <div class="gallery-item">
                <img src="foto3.jpg" alt="Veri Görseli 3">
            </div>
        </div>

        <h2>>_ DOSYA_ÇIKTILARI</h2>
        <div class="download-section">
            <!-- İndirme linkleri -->
            <a href="veri_yedek_v1.zip" class="btn-download" download>[ YEDEK_DOSYASINI_İNDİR .ZIP ]</a>
            <a href="scriptler.7z" class="btn-download" download>[ ÇALIŞTIRILABİLİR_KOMUTLAR .7Z ]</a>
        </div>
    </div>

</body>
</html>
