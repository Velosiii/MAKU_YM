<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Makü Yazılım Mühendisliği Arşivi</title>
    <style>
        :root {
            --neon-green: #39ff14;
            --bg-dark: #000000;
            --panel-bg: rgba(17, 17, 17, 0.85);
        }

        body {
            background-color: var(--bg-dark);
            color: var(--neon-green);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }

        /* --- MATRIX ARKAPLAN --- */
        #matrixCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
        }

        /* --- SAYFA YERLEŞİMİ (KUSURSUZ 3 SÜTUN) --- */
        .layout-wrapper {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 250px;
            flex-shrink: 0;
            z-index: 1;
        }

        .main-content {
            flex-grow: 1;
            max-width: 800px;
        }

        /* Ortak Panel Stili */
        .panel {
            background-color: var(--panel-bg);
            backdrop-filter: blur(4px);
            border: 1px solid var(--neon-green);
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.3), inset 0 0 10px rgba(57, 255, 20, 0.1);
            padding: 20px;
            border-radius: 5px;
        }

        /* --- SOL ÜST ARAMA ÇUBUĞU --- */
        .search-box {
            width: 100%;
            background-color: #000;
            color: var(--neon-green);
            border: 1px dashed var(--neon-green);
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.1em;
            outline: none;
            box-sizing: border-box;
            transition: 0.3s;
            box-shadow: inset 0 0 5px rgba(57, 255, 20, 0.2);
        }
        .search-box:focus {
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.5), inset 0 0 5px rgba(57, 255, 20, 0.2);
        }

        /* --- SAĞ ÜST SİMETRİ / DURUM KUTUSU --- */
        .status-box {
            width: 100%;
            color: var(--neon-green);
            border: 1px dashed rgba(57, 255, 20, 0.4);
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.1em;
            text-align: center;
            box-sizing: border-box;
            text-shadow: 0 0 5px var(--neon-green);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.6; box-shadow: inset 0 0 2px rgba(57, 255, 20, 0.1); }
            50% { opacity: 1; box-shadow: inset 0 0 10px rgba(57, 255, 20, 0.3); }
        }

        /* --- REKLAM ALANLARI --- */
        .ad-slot {
            width: 100%;
            height: 250px;
            border: 1px solid rgba(57, 255, 20, 0.5);
            background-color: #050505;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        .ad-slot::before {
            content: "[ REKLAM_ALANI ]";
            position: absolute;
            color: rgba(57, 255, 20, 0.3);
            font-size: 0.9em;
            z-index: 0;
        }
        .ad-slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            position: relative;
        }

        /* --- KLASÖR VE ANA İÇERİK --- */
        h1 {
            text-align: center;
            text-transform: uppercase;
            text-shadow: 0 0 5px var(--neon-green), 0 0 10px var(--neon-green);
            border-bottom: 1px dashed var(--neon-green);
            padding-bottom: 15px;
            margin-top: 0;
            margin-bottom: 30px;
        }

        details {
            margin-bottom: 15px;
            border: 1px solid rgba(57, 255, 20, 0.3);
            padding: 10px;
            border-radius: 5px;
            background: rgba(10, 10, 10, 0.9);
        }
        summary {
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            outline: none;
            text-shadow: 0 0 3px var(--neon-green);
            list-style-type: "📁 ";
        }
        details[open] > summary {
            list-style-type: "📂 ";
            color: #fff;
            border-bottom: 1px dashed rgba(57, 255, 20, 0.3);
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        summary:hover {
            color: #fff;
            text-shadow: 0 0 8px var(--neon-green);
        }

        .folder-content {
            margin-left: 10px;
            border-left: 1px dashed rgba(57, 255, 20, 0.5);
            padding-left: 20px;
        }

        details details {
            margin-bottom: 10px;
            border-color: rgba(57, 255, 20, 0.15);
            background: rgba(5, 5, 5, 0.9);
        }

        /* --- FOTOĞRAF GALERİSİ --- */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            margin-top: 15px;
            margin-bottom: 15px;
        }
        .gallery-item img {
            width: 100%;
            height: 120px;
