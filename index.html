<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Makü Yazılım Mühendisliği Arşivi</title>
    <style>
        :root {
            --neon-green: #39ff14;
            --bg-dark: #000000;
            --panel-bg: rgba(17, 17, 17, 0.85);
        }

        body {
            background-color: var(--bg-dark);
            color: var(--neon-green);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }

        /* --- MATRIX ARKAPLAN --- */
        #matrixCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
        }

        /* --- SAYFA YERLEŞİMİ (KUSURSUZ 3 SÜTUN) --- */
        .layout-wrapper {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 250px;
            flex-shrink: 0;
            z-index: 1;
        }

        .main-content {
            flex-grow: 1;
            max-width: 800px;
        }

        /* Ortak Panel Stili */
        .panel {
            background-color: var(--panel-bg);
            backdrop-filter: blur(4px);
            border: 1px solid var(--neon-green);
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.3), inset 0 0 10px rgba(57, 255, 20, 0.1);
            padding: 20px;
            border-radius: 5px;
        }

        /* --- SOL ÜST ARAMA ÇUBUĞU --- */
        .search-box {
            width: 100%;
            background-color: #000;
            color: var(--neon-green);
            border: 1px dashed var(--neon-green);
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.1em;
            outline: none;
            box-sizing: border-box;
            transition: 0.3s;
            box-shadow: inset 0 0 5px rgba(57, 255, 20, 0.2);
        }
        .search-box:focus {
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.5), inset 0 0 5px rgba(57, 255, 20, 0.2);
        }

        /* --- SAĞ ÜST SİMETRİ / DURUM KUTUSU --- */
        .status-box {
            width: 100%;
            color: var(--neon-green);
            border: 1px dashed rgba(57, 255, 20, 0.4);
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.1em;
            text-align: center;
            box-sizing: border-box;
            text-shadow: 0 0 5px var(--neon-green);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.6; box-shadow: inset 0 0 2px rgba(57, 255, 20, 0.1); }
            50% { opacity: 1; box-shadow: inset 0 0 10px rgba(57, 255, 20, 0.3); }
        }

        /* --- REKLAM ALANLARI --- */
        .ad-slot {
            width: 100%;
            height: 250px;
            border: 1px solid rgba(57, 255, 20, 0.5);
            background-color: #050505;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        .ad-slot::before {
            content: "[ REKLAM_ALANI ]";
            position: absolute;
            color: rgba(57, 255, 20, 0.3);
            font-size: 0.9em;
            z-index: 0;
        }
        .ad-slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            position: relative;
        }

        /* --- KLASÖR VE ANA İÇERİK --- */
        h1 {
            text-align: center;
            text-transform: uppercase;
            text-shadow: 0 0 5px var(--neon-green), 0 0 10px var(--neon-green);
            border-bottom: 1px dashed var(--neon-green);
            padding-bottom: 15px;
            margin-top: 0;
            margin-bottom: 30px;
        }

        details {
            margin-bottom: 15px;
            border: 1px solid rgba(57, 255, 20, 0.3);
            padding: 10px;
            border-radius: 5px;
            background: rgba(10, 10, 10, 0.9);
        }
        summary {
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            outline: none;
            text-shadow: 0 0 3px var(--neon-green);
            list-style-type: "📁 ";
        }
        details[open] > summary {
            list-style-type: "📂 ";
            color: #fff;
            border-bottom: 1px dashed rgba(57, 255, 20, 0.3);
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        summary:hover {
            color: #fff;
            text-shadow: 0 0 8px var(--neon-green);
        }

        .folder-content {
            margin-left: 10px;
            border-left: 1px dashed rgba(57, 255, 20, 0.5);
            padding-left: 20px;
        }

        details details {
            margin-bottom: 10px;
            border-color: rgba(57, 255, 20, 0.15);
            background: rgba(5, 5, 5, 0.9);
        }

        /* --- FOTOĞRAF GALERİSİ --- */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            margin-top: 15px;
            margin-bottom: 15px;
        }
        .gallery-item img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border: 1px solid var(--neon-green);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            opacity: 0.8;
        }
        .gallery-item img:hover {
            transform: scale(1.05);
            box-shadow: 0 0 10px var(--neon-green);
            opacity: 1;
        }

        /* --- DOSYA BUTONLARI (GÖRÜNTÜLE VE İNDİR) --- */
        .btn-group {
            display: flex;
            gap: 10px;
            margin: 5px 0;
            flex-wrap: wrap;
        }
        .file-link, .view-link {
            display: inline-block;
            color: var(--neon-green);
            text-decoration: none;
            padding: 6px 12px;
            border: 1px solid var(--neon-green);
            background: rgba(0,0,0,0.8);
            transition: 0.3s;
            font-size: 0.9em;
        }
        .file-link:before { content: "💾 "; }
        
        .view-link.pdf-btn { border-color: #ff3939; color: #ff3939; }
        .view-link.pdf-btn:before { content: "📄 [PDF AÇ] "; font-weight: bold; }
        .view-link.pdf-btn:hover { background-color: #ff3939; color: #000; box-shadow: 0 0 10px #ff3939; }

        .view-link.slide-btn { border-color: #39aeff; color: #39aeff; }
        .view-link.slide-btn:before { content: "📊 [SLAYT AÇ] "; font-weight: bold; }
        .view-link.slide-btn:hover { background-color: #39aeff; color: #000; box-shadow: 0 0 10px #39aeff; }

        .file-link:hover {
            color: #000;
            background-color: var(--neon-green);
            box-shadow: 0 0 10px var(--neon-green);
        }

        /* --- TAM EKRAN FOTOĞRAF VE BELGE (MODAL) EKRANLARI --- */
        #lightbox, #docModal {
            display: none;
            position: fixed;
            z-index: 9999;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            align-items: center;
            justify-content: center;
        }
        #lightbox img {
            max-width: 85%;
            max-height: 85%;
            border: 2px solid var(--neon-green);
            box-shadow: 0 0 30px rgba(57, 255, 20, 0.5);
        }
        #docModal iframe {
            width: 85%;
            height: 85%;
            border: 2px solid var(--neon-green);
            box-shadow: 0 0 30px rgba(57, 255, 20, 0.5);
            background-color: #fff; /* Belge okunabilirliği için beyaz arka plan */
        }

        .modal-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            color: var(--neon-green);
            border: none;
            font-size: 4em;
            cursor: pointer;
            text-shadow: 0 0 10px var(--neon-green);
            padding: 20px;
            user-select: none;
            transition: 0.2s;
        }
        .modal-btn:hover { color: #fff; transform: translateY(-50%) scale(1.2); }
        #prevBtn { left: 20px; }
        #nextBtn { right: 20px; }
        
        .close-btn {
            position: absolute;
            top: 20px !important;
            right: 30px !important;
            transform: none !important;
            font-size: 3em;
            padding: 10px;
        }
        .close-btn:hover { transform: scale(1.2) !important; }

        .cursor { display: inline-block; width: 10px; height: 20px; background-color: var(--neon-green); animation: blink 1s step-end infinite; vertical-align: text-bottom; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* Mobil Tasarım */
        @media (max-width: 900px) {
            .layout-wrapper { flex-direction: column; }
            .sidebar { width: 100%; flex-direction: row; }
            .ad-slot { height: 150px; }
            .status-box { display: none; }
        }
        @media (max-width: 600px) {
            .sidebar { flex-direction: column; }
        }
    </style>
</head>
<body>

    <canvas id="matrixCanvas"></canvas>

    <div class="layout-wrapper">
        <!-- SOL KENAR -->
        <div class="sidebar">
            <div class="panel">
                <input type="text" id="searchInput" class="search-box" placeholder=">_ KLASÖR ARA...">
            </div>
            <div class="panel" style="padding: 10px;">
                <div class="ad-slot"><img src="reklam1.jpg" alt=""></div>
            </div>
            <div class="panel" style="padding: 10px;">
                <div class="ad-slot"><img src="reklam2.jpg" alt=""></div>
            </div>
        </div>

        <!-- ANA İÇERİK -->
        <div class="panel main-content">
            <h1>[ Makü Yazılım Mühendisliği Arşivi ]<span class="cursor"></span></h1>

            <details class="main-folder">
                <summary>1. DÖNEM - Şu an Buradayız</summary>
                <div class="folder-content">
                    
                    <details class="sub-folder">
                        <summary>MATEMATİK</summary>
                        <div class="folder-content">
                            <div class="gallery">
                                <div class="gallery-item"><img src="mat1.jpg" alt="Matematik 1" class="lightbox-img"></div>
                                <div class="gallery-item"><img src="mat2.jpg" alt="Matematik 2" class="lightbox-img"></div>
                            </div>
                            <div class="btn-group">
                                <!-- PDF Butonu -->
                                <a href="javascript:void(0)" onclick="openDoc('matematik_1_donem_ozet.pdf', 'pdf')" class="view-link pdf-btn">1. Dönem Özet</a>
                                <!-- Slayt Butonu -->
                                <a href="javascript:void(0)" onclick="openDoc('sunumlar/matematik_hafta_1.pptx', 'slide')" class="view-link slide-btn">1. Hafta Slaytı</a>
                                <a href="matematik_1_donem_ozet.zip" class="file-link" download>Tüm Arşivi İndir (.ZIP)</a>
                            </div>
                        </div>
                    </details>

                    <details class="sub-folder">
                        <summary>AYRIK MATEMATİK</summary>
                        <div class="folder-content">
                            <div class="gallery">
                                <div class="gallery-item"><img src="mat1.jpg" alt="Matematik 1" class="lightbox-img"></div>
                                <div class="gallery-item"><img src="mat2.jpg" alt="Matematik 2" class="lightbox-img"></div>
                            </div>
                            <div class="btn-group">
                                <a href="javascript:void(0)" onclick="openDoc('ayrik_mat_final.pdf', 'pdf')" class="view-link pdf-btn">Final Notları</a>
                                <a href="javascript:void(0)" onclick="openDoc('ayrik_mat_sunum.pptx', 'slide')" class="view-link slide-btn">Ders Sunumu</a>
                                <a href="ayrik_mat_notlar.zip" class="file-link" download>Ders Notları .ZIP</a>
                            </div>
                        </div>
                    </details>
                    
                    <details class="sub-folder">
                        <summary>FİZİK</summary>
                        <div class="folder-content">
                            <div class="gallery">
                                <div class="gallery-item"><img src="fizik1.jpg" alt="Fizik 1" class="lightbox-img"></div>
                            </div>
                            <div class="btn-group">
                                <a href="javascript:void(0)" onclick="openDoc('fizik_deney_raporu.pdf', 'pdf')" class="view-link pdf-btn">Deney Raporu</a>
                                <a href="fizik_deney_raporu.pdf" class="file-link" download>Deney Raporu İndir (.PDF)</a>
                            </div>
                        </div>
                    </details>
                </div>
            </details>

            <details class="main-folder">
                <summary>2. DÖNEM</summary>
                <div class="folder-content">
                    <details class="sub-folder">
                        <summary>KİMYA</summary>
                        <div class="folder-content">
                            <div class="gallery">
                                <div class="gallery-item"><img src="kimya1.jpg" alt="Kimya 1" class="lightbox-img"></div>
                                <div class="gallery-item"><img src="kimya2.jpg" alt="Kimya 2" class="lightbox-img"></div>
                            </div>
                        </div>
                    </details>
                </div>
            </details>

            <div style="margin-top: 40px; text-align: right; font-size: 0.8em; opacity: 0.5; border-top: 1px solid rgba(57,255,20,0.3); padding-top: 10px;">
                OS: MADE BY VELOSI
            </div>
        </div>

        <!-- SAĞ KENAR -->
        <div class="sidebar">
            <div class="panel">
                <div class="status-box">[ He He He ]</div>
            </div>
            <div class="panel" style="padding: 10px;">
                <div class="ad-slot"><img src="reklam3.jpg" alt=""></div>
            </div>
            <div class="panel" style="padding: 10px;">
                <div class="ad-slot"><img src="reklam4.jpg" alt=""></div>
            </div>
        </div>
    </div>

    <!-- LIGHTBOX (GÖRSELLER İÇİN) -->
    <div id="lightbox">
        <button id="closeBtn" class="modal-btn close-btn" onclick="closeLightbox()">×</button>
        <button id="prevBtn" class="modal-btn" onclick="changeImage(-1)">&#10094;</button>
        <img id="lightboxImg" src="">
        <button id="nextBtn" class="modal-btn" onclick="changeImage(1)">&#10095;</button>
    </div>

    <!-- BELGE OKUYUCU MODALI (PDF VE SLAYTLAR İÇİN) -->
    <div id="docModal">
        <button class="modal-btn close-btn" onclick="closeDoc()">×</button>
        <iframe id="docIframe" src=""></iframe>
    </div>

    <script>
        // --- ARAMA MOTORU ---
        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('input', function(e) {
            const query = e.target.value.toLowerCase();
            const mainFolders = document.querySelectorAll('.main-folder');

            mainFolders.forEach(main => {
                let mainHasMatch = false;
                const mainSummaryText = main.querySelector('summary').innerText.toLowerCase();
                const mainMatches = mainSummaryText.includes(query);
                const subFolders = main.querySelectorAll('.sub-folder');
                
                subFolders.forEach(sub => {
                    const subSummaryText = sub.querySelector('summary').innerText.toLowerCase();
                    if (subSummaryText.includes(query) || mainMatches) {
                        sub.style.display = 'block';
                        mainHasMatch = true;
                    } else {
                        sub.style.display = 'none';
                    }
                });

                if (query !== '') {
                    if (mainHasMatch || mainMatches) {
                        main.style.display = 'block';
                        main.open = true;
                    } else {
                        main.style.display = 'none';
                    }
                } else {
                    main.style.display = 'block';
                    main.open = false;
                    subFolders.forEach(sub => sub.style.display = 'block');
                }
            });
        });

        // --- MATRIX EFEKTİ ---
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*YORHAVELOSI'.split('');
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = [];
        for(let x = 0; x < columns; x++) drops[x] = 1;

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#39ff14';
            ctx.font = fontSize + 'px Courier New';
            for(let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if(drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 33);
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // --- LIGHTBOX (RESİMLER İÇİN) ---
        let images = Array.from(document.querySelectorAll('.lightbox-img'));
        let currentIndex = 0;
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');

        images.forEach((img, index) => {
            img.addEventListener('click', function() {
                currentIndex = index;
                showLightbox();
            });
        });

        function showLightbox() {
            lightboxImg.src = images[currentIndex].src;
            lightbox.style.display = 'flex';
        }
        function closeLightbox() {
            lightbox.style.display = 'none';
        }
        function changeImage(direction) {
            currentIndex += direction;
            if (currentIndex >= images.length) currentIndex = 0;
            else if (currentIndex < 0) currentIndex = images.length - 1;
            lightboxImg.src = images[currentIndex].src;
        }

        // --- BELGE OKUYUCU (PDF VE SLAYTLAR İÇİN) ---
        const docModal = document.getElementById('docModal');
        const docIframe = document.getElementById('docIframe');

        function openDoc(docUrl, type) {
            // Slayt (PPT, PPTX) ise Google Docs Viewer üzerinden çalıştır
            if (type === 'slide') {
                // Not: Google Viewer'ın çalışması için web sitenin internete açık olması (GitHub Pages linki) gerekir. Local'de (bilgisayarında) denerken çalışmayabilir.
                const absoluteUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/')) + '/' + docUrl;
                docIframe.src = `https://docs.google.com/viewer?url=${encodeURIComponent(absoluteUrl)}&embedded=true`;
            } 
            // PDF ise direkt aç
            else if (type === 'pdf') {
                docIframe.src = docUrl;
            }
            
            docModal.style.display = 'flex';
        }

        function closeDoc() {
            docModal.style.display = 'none';
            docIframe.src = '';
        }

        // --- KLAVYE KISAYOLLARI ---
        document.addEventListener('keydown', function(e) {
            if (lightbox.style.display === 'flex') {
                if (e.key === 'Escape') closeLightbox();
                if (e.key === 'ArrowRight') changeImage(1);
                if (e.key === 'ArrowLeft') changeImage(-1);
            }
            if (docModal.style.display === 'flex') {
                if (e.key === 'Escape') closeDoc();
            }
        });
    </script>
</body>
</html>
